  #     MYSQL_HOST: mysql
  #     DB_NAME: content_db
  #     SPRING_DATASOURCE_PASSWORD: root1234
  #     REDIS_HOST: redis
  #     REDIS_PORT: 6379
  #   ports:
  #     - "8080:8080"
  #   depends_on:
  #     mysql:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy

volumes:
  mysql-data:
