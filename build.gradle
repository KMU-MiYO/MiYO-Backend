plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.5'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'io.github.herbpot'
version = '0.0.1-SNAPSHOT'
description = 'MiYO-Backend'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'io.lettuce:lettuce-core'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.12.3'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.3'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.3'

    // Swagger/OpenAPI
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.13'

    // Hibernate Spatial: MySQL Spatial 데이터 타입 지원
    implementation 'org.hibernate.orm:hibernate-spatial'

    // JTS (Java Topology Suite): Spatial 데이터 타입 (Point, Polygon 등) 제공
    implementation 'org.locationtech.jts:jts-core:1.19.0'

    // AWS SDK V2 for S3 (NCP Object Storage 호환)
    implementation 'software.amazon.awssdk:s3:2.20.56'
    implementation 'software.amazon.awssdk:auth:2.20.56'

    // AWS SDK V1 for S3 (NCP Object Storage - Base64 이미지 업로드용)
    implementation 'com.amazonaws:aws-java-sdk-s3:1.12.529'

    implementation 'com.mysql:mysql-connector-j'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'com.h2database:h2'
}

tasks.named('test') {
    useJUnitPlatform()
}
