spring.application.name=MiYO-Backend

# H2 Database for Testing
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

# Spring JPA for Testing
spring.jpa.database=h2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.generate-ddl=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration (Test Key)
jwt.decode-key=dGVzdC1zZWNyZXQta2V5LWZvci1qd3QtdGVzdGluZy1wdXJwb3Nlcy0xMjM0NTY3ODkw

# User Service Configuration (Mock)
user-service.url=http://localhost:8081

# Gemini AI (Mock)
gemini.api-key=test-api-key
gemini.api-url=http://localhost:8082/mock

# NCP Object Storage (Mock)
ncp.access-key=test-access-key
ncp.secret-key=test-secret-key
ncp.region=kr-standard
ncp.endpoint=http://localhost:8083/mock
ncp.bucket-name=test-bucket
ncp.directory=test/

# Disable Redis for testing
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

# Logging
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.io.github.herbpot.miyobackend=DEBUG
