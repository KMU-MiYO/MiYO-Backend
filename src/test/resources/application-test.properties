spring.application.name=MiYO-Backend

# H2 Database for Testing (Write DB)
spring.datasource.write.driver-class-name=org.h2.Driver
spring.datasource.write.jdbc-url=jdbc:h2:mem:testwritedb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.write.username=sa
spring.datasource.write.password=
spring.datasource.write.hikari.maximum-pool-size=5

# H2 Database for Testing (Read DB)
spring.datasource.read.driver-class-name=org.h2.Driver
spring.datasource.read.jdbc-url=jdbc:h2:mem:testreaddb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.read.username=sa
spring.datasource.read.password=
spring.datasource.read.hikari.maximum-pool-size=5

# Spring JPA for Testing
spring.jpa.database=h2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.generate-ddl=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration (Test Key)
jwt.decode-key=dGVzdC1zZWNyZXQta2V5LWZvci1qd3QtdGVzdGluZy1wdXJwb3Nlcy0xMjM0NTY3ODkw

# User Service Configuration (Mock)
user-service.url=http://localhost:8081

# Search Configuration
app.search.default-radius-km=1.0

# Disable Redis for testing
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

# Logging
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
