spring.application.name=MiYO-Backend

# Write DataSource (MySQL - posts_write_db)
spring.datasource.write.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.write.jdbc-url=jdbc:mysql://${WRITE_MYSQL_HOST:localhost}:3306/${WRITE_DB_NAME:posts_write_db}?useSSL=false&characterEncoding=UTF-8&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.write.username=root
spring.datasource.write.password=${WRITE_MYSQL_PASSWORD:miyo03718}

# Read DataSource (MySQL - posts_read_db)
spring.datasource.read.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.read.jdbc-url=jdbc:mysql://${READ_MYSQL_HOST:localhost}:3307/${READ_DB_NAME:posts_read_db}?useSSL=false&characterEncoding=UTF-8&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.read.username=root
spring.datasource.read.password=${READ_MYSQL_PASSWORD:miyo03718}

# Spring JPA
spring.jpa.database=mysql
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.generate-ddl=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# swagger-ui custom path
springdoc.api-docs.path=/dev/posts/v3/api-docs
springdoc.swagger-ui.path=/dev/posts/swagger-ui.html
springdoc.swagger-ui.url=/dev/posts/v3/api-docs

# JWT Configuration (Decode Key)
# Must be a valid Base64 encoded string matching user-service's JWT secret key
# Default value is a valid Base64 placeholder - replace with actual key from user-service
jwt.decode-key=${jwtSecret}

# User Service Configuration (MSA)
user-service.url=${USER_SERVICE_URL:http://localhost:8081}

## Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Search Configuration
app.search.default-radius-km=${DEFAULT_RADIUS_KM:1.0}