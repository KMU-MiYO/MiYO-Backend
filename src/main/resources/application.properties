spring.application.name=MiYO-Backend

# Spring DataSource (MySQL)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${MYSQL_HOST}:3306/${DB_NAME: challenge_db}?useSSL=false&characterEncoding=UTF-8&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:challenge_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# HikariCP Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000

# Spring JPA
spring.jpa.database=mysql
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.generate-ddl=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Hibernate Naming Strategy
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Hibernate Spatial Settings
spring.jpa.properties.hibernate.dialect.storage_engine=innodb
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Spring Data Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Redis Pub/Sub Topic Configuration
# Challenge Domain Topics (challenge/main 서버 자체 이벤트)
app.redis.topic.contest-post-events=contest-post-events-channel
app.redis.topic.contest-comment-events=contest-comment-events-channel
app.redis.topic.contest-empathy-events=contest-empathy-events-channel

# Community Domain Topics (posts/main 서버와 공유)
app.redis.topic.post-events=post-events-channel
app.redis.topic.comment-events=comment-events-channel
app.redis.topic.empathy-events=empathy-events-channel

# Actuator Health Check Configuration
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# Application Settings

# JWT Configuration
jwt.decode-key=${jwtSecret}

# User Service Configuration
user-service.url=${USER_SERVICE_URL:http://localhost:8081}

# Gemini AI Settings (Image Generation)
gemini.api-key=${GEMINI_API_KEY:your-api-key-here}
gemini.model=gemini-2.5-flash-image
gemini.location=asia-northeast3
gemini.api-url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-image:generateContent

# NCP Object Storage Settings
ncp.access-key=${NCP_ACCESS_KEY}
ncp.secret-key=${NCP_SECRET_KEY}
ncp.region=kr-standard
ncp.endpoint=https://kr.object.ncloudstorage.com
ncp.bucket-name=${NCP_BUCKET_NAME:contest90-image-bucket}
ncp.directory=${NCP_DIRECTORY:generate/}

# NCP Object Storage Settings (S3 Compatible)
ncp.object-storage.access-key=${NCP_ACCESS_KEY}
ncp.object-storage.secret-key=${NCP_SECRET_KEY}
ncp.object-storage.region=kr-standard
ncp.object-storage.endpoint=https://kr.object.ncloudstorage.com
ncp.object-storage.bucket-name=${NCP_BUCKET_NAME:contest90-image-bucket}

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/dev/challenge/v3/api-docs
springdoc.swagger-ui.path=/dev/challenge/swagger-ui.html

# Logging Configuration
logging.level.io.github.herbpot.miyobackend.domain.challenge.service=DEBUG
logging.level.io.github.herbpot.miyobackend.domain.challenge.config=DEBUG
logging.level.org.springframework.data.redis=DEBUG
logging.level.org.springframework.data.redis.listener=DEBUG
