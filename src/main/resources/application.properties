spring.application.name=MiYO-Backend

# Spring DataSource (MySQL)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${MYSQL_HOST}:3306/${DB_NAME}?useSSL=false&characterEncoding=UTF-8&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Spring JPA
spring.jpa.database=mysql
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.generate-ddl=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Hibernate Spatial Settings
spring.jpa.properties.hibernate.dialect.storage_engine=innodb
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Spring Data Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Application Settings

# JWT Configuration
jwt.decode-key=${JWT_DECODE_KEY:dGVzdC1zZWNyZXQta2V5LWZvci1qd3QtdGVzdGluZy1wdXJwb3Nlcy0xMjM0NTY3ODkw}

# User Service Configuration
user-service.url=${USER_SERVICE_URL:http://localhost:8081}

# Gemini AI Settings
gemini.api-key=${GEMINI_API_KEY:your-api-key-here}
gemini.model=imagen-3.0-generate-001
gemini.api-url=https://aiplatform.googleapis.com/v1/publishers/google/models/gemini-2.5-flash-lite:streamGenerateContent

# NCP Object Storage Settings
ncp.access-key=${NCP_ACCESS_KEY}
ncp.secret-key=${NCP_SECRET_KEY}
ncp.region=kr-standard
ncp.endpoint=http://contest90-image-bucket.s3-website.kr.object.ncloudstorage.com
ncp.bucket-name=${NCP_BUCKET_NAME:contest90-image-bucket}
ncp.directory=${NCP_DIRECTORY:generate/}